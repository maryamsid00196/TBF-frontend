<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" fill="none">
  <defs>
    <linearGradient id="tbgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Badge with TBG letters (not T) -->
  <rect x="0" y="0" width="56" height="56" rx="12" fill="url(#tbgGrad)" filter="url(#logoGlow)"/>
  <text x="28" y="38" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="white" letter-spacing="-0.02em">TBG</text>
  <!-- Single line: Time Business Group -->
  <text x="72" y="36" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="white" letter-spacing="-0.01em">Time Business Group</text>
</svg>
